<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Condo</title>
    <link rel="icon" type="image/png" sizes="512x512" href="https://upload.wikimedia.org/wikipedia/commons/7/70/Roblox_Corporation_2025_logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-hover: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.85);
            --glass-inner: inset 0 1px 0 rgba(255,255,255,0.9);
            --glass-shadow: 0 8px 32px rgba(80, 120, 200, 0.14);
            --ink: #12161f;
            --ink-soft: #38414f;
            --ink-muted: #6b7486;
            --rbx-green: #00b06f;
            --rbx-yellow: #e0a800;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: linear-gradient(180deg, rgba(245,250,255,0.45) 0%, rgba(238,244,255,0.50) 50%, rgba(243,240,255,0.55) 100%),
                        url('https://cdn.phototourl.com/anon/2026-11-16-e6b748db-92de-414d-8266-593f9f63d7bb.jpg') center/cover fixed no-repeat;
            background-attachment: fixed, fixed;
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
        a { color: inherit; text-decoration: none; }

        /* Navbar */
        .navbar {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            height: 60px; padding: 0 16px; display: flex; align-items: center;
            justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 100;
            box-shadow: var(--glass-inner);
        }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.1rem; }
        .logo img { width: 30px; height: 30px; border-radius: 8px; padding: 3px; background: #fff; border: 1px solid var(--glass-border); box-shadow: 0 2px 8px rgba(80,120,200,0.18); }
        .search { flex-grow: 1; max-width: 320px; position: relative; }
        .search input {
            width: 100%; background: rgba(255,255,255,0.65); border: 1px solid var(--glass-border);
            border-radius: 10px; padding: 7px 14px 7px 34px; font-size: 0.82rem; outline: none;
            box-shadow: var(--glass-inner); transition: all 0.18s ease;
        }
        .search input:focus { border-color: rgba(0,176,111,0.55); background: rgba(255,255,255,0.88); }
        .search i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); font-size: 12px; }

        /* Grid */
        .container { max-width: 1000px; margin: 0 auto; padding: 20px 14px 60px; }
        .games-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 500px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 800px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }

        .tile {
            background: var(--glass-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: var(--glass-inner), var(--glass-shadow);
        }
        .tile:hover { transform: translateY(-2px); box-shadow: var(--glass-inner), 0 16px 44px rgba(80,120,200,0.22); background: var(--glass-bg-hover); }
        .tile-img { aspect-ratio: 16/10; background: rgba(0,0,0,0.1); }
        .tile-img img { width: 100%; height: 100%; object-fit: cover; }
        .tile-body { padding: 12px 14px; display: flex; flex-direction: column; flex-grow: 1; }
        .tile-title { font-weight: 700; font-size: 0.92rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tile-stats { display: flex; justify-content: space-between; font-size: 0.76rem; color: var(--ink-soft); margin-bottom: 10px; }
        .play-btn {
            width: 100%; background: linear-gradient(180deg, #22c55e 0%, #00b06f 100%);
            color: #fff; font-weight: 700; padding: 8px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: auto;
            transition: opacity 0.2s ease; box-shadow: 0 4px 14px rgba(0,176,111,0.35);
        }
        .play-btn:hover { opacity: 0.9; }

        /* Fake Chrome Modal */
        .chrome-modal {
            position: fixed; inset: 0; background: rgba(5, 6, 9, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 10px;
        }
        .chrome-modal.active { display: flex; }
        .chrome-window {
            width: 100%; max-width: 1020px; height: 90vh; background: #fff;
            border-radius: 10px; overflow: hidden; display: flex; flex-direction: column;
        }
        .chrome-bar { background: #dee1e6; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; }
        .chrome-tab { background: #fff; border-radius: 6px 6px 0 0; height: 26px; display: flex; align-items: center; padding: 0 10px; gap: 6px; margin-top: 8px; font-size: 11px; }
        .chrome-tab img { width: 12px; height: 12px; }
        .chrome-close { color: #5f6368; cursor: pointer; padding: 0 8px; font-size: 14px; }
        .chrome-toolbar { background: #fff; height: 38px; display: flex; align-items: center; padding: 0 10px; border-bottom: 1px solid #dadce0; gap: 10px; }
        .chrome-address {
            flex-grow: 1; background: #f1f3f4; height: 26px; border-radius: 13px;
            display: flex; align-items: center; padding: 0 12px; gap: 6px;
        }
        .chrome-url { font-size: 11px; color: #202124; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chrome-url-dim { color: #5f6368; }
        .chrome-content { flex-grow: 1; position: relative; background: #f9f9f9; }
        .chrome-content iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/70/Roblox_Corporation_2025_logo.svg" alt="logo">
            <span>Condo</span>
        </div>
        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search games..." oninput="render()">
        </div>
    </nav>

    <main class="container">
        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <div class="chrome-modal" id="chromeModal">
        <div class="chrome-window">
            <div class="chrome-bar">
                <div class="chrome-tab">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/7/70/Roblox_Corporation_2025_logo.svg" alt="icon">
                    <span>Roblox</span>
                </div>
                <div class="chrome-close" onclick="closeBrowser()">✕</div>
            </div>
            <div class="chrome-toolbar">
                <div class="chrome-address">
                    <svg viewBox="0 0 24 24" width="10" height="10" fill="#5f6368"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                    <span class="chrome-url" id="fakeUrlText"><span class="chrome-url-dim">https://</span>www.roblox.com/games/95206881/Baseplate...</span>
                </div>
            </div>
            <div class="chrome-content">
                <!-- Sandbox restrictions completely stripped out so the raw URL loads directly -->
                <iframe id="browserIframe" src="about:blank"></iframe>
            </div>
        </div>
    </div>

    <script>
        const REAL_URL = "https://www.roblox.rw/games/95206881/Baseplate?privateServerLinkCode=26065913844785075427592831388890";
        const FAKE_URL = "www.roblox.com/games/95206881/Baseplate?privateServerLinkCode=26065913844785075427592831388890";

        const games = [
            { title: "Late Night Condo", creator: "xVibeDev", players: "18/20", rating: "4.9", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" },
            { title: "Vibe Penthouse", creator: "KairoBuilds", players: "12/20", rating: "4.7", img: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=600&q=80" },
            { title: "Neko Cafe", creator: "LofiStudio", players: "15/20", rating: "4.8", img: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?auto=format&fit=crop&w=600&q=80" },
            { title: "Private Apartment", creator: "NekoWorks", players: "20/20", rating: "5.0", img: "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?auto=format&fit=crop&w=600&q=80" },
            { title: "Sunset Rooftop", creator: "ZayCreates", players: "9/20", rating: "4.6", img: "https://images.unsplash.com/photo-1618172193622-ae2d025f4032?auto=format&fit=crop&w=600&q=80" },
            { title: "Midnight Club", creator: "MochiDev", players: "17/20", rating: "4.9", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" },
            { title: "Cozy Bedroom", creator: "VexedRBLX", players: "14/20", rating: "4.8", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80" },
            { title: "Luxury Villa", creator: "CloudNineGames", players: "19/20", rating: "4.7", img: "https://images.unsplash.com/photo-1614850523459-c2f4c699c52e?auto=format&fit=crop&w=600&q=80" }
        ];

        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        
        function render() {
            const query = searchInput.value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(query) || g.creator.toLowerCase().includes(query));
            
            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--ink-muted);">No games found.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(g => `
                <div class="tile">
                    <div class="tile-img"><img src="${g.img}" alt="${g.title}"></div>
                    <div class="tile-body">
                        <div class="tile-title">${g.title}</div>
                        <div class="tile-stats">
                            <span style="color:var(--rbx-yellow);font-weight:bold;">⭐ ${g.rating}</span>
                            <span><i class="fa-solid fa-user" style="font-size:10px;"></i> ${g.players}</span>
                        </div>
                        <button class="play-btn" onclick="launchGame()"><i class="fa-solid fa-play"></i> Play</button>
                    </div>
                </div>
            `).join('');
        }

        function launchGame() {
            const modal = document.getElementById('chromeModal');
            const iframe = document.getElementById('browserIframe');
            const fakeTxt = document.getElementById('fakeUrlText');

            fakeTxt.innerHTML = `<span class="chrome-url-dim">https://</span>${FAKE_URL}`;
            iframe.src = REAL_URL;
            modal.classList.add('active');
        }

        function closeBrowser() {
            document.getElementById('chromeModal').classList.remove('active');
            document.getElementById('browserIframe').src = "about:blank";
        }

        render();
    </script>
</body>
</html>
